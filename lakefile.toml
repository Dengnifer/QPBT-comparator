name = "QPBTComparator"
version = "0.1.0"
defaultTargets = ["QPBTComparator", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "MIPStarRE"
git = "https://github.com/Dengnifer/MIPStarRE-A.git"
# Pre-integration pin retained until the compact modules and supported
# toolchain are available together on canonical MIPStarRE-QPBT main.
rev = "ecb97d1f66eec1e6fad964f144f78b91ce1fab36"

[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "QPBTComparator"
