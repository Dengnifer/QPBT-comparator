name = "QPBTComparator"
version = "0.1.0"
defaultTargets = ["QPBTComparator", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "MIPStarRE"
git = "https://github.com/Dengnifer/MIPStarRE-A.git"
# Pin to the audited library commit; bump together with a regenerated
# Challenge.lean (see the MIPStarRE-A repository's docs/comparator.md).
rev = "a3683e9b75da4aeb52174af2cccacfde606361ce"

[[lean_lib]]
name = "Challenge"
# one challenge module per contributing library module
globs = ["Challenge", "Challenge.+"]

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "QPBTComparator"
