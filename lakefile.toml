name = "QPBTComparator"
version = "0.1.0"
defaultTargets = ["QPBTComparator", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "MIPStarRE"
git = "https://github.com/Dengnifer/MIPStarRE-QPBT.git"
# Pin to the audited library commit; bump together with a regenerated
# Challenge.lean (see the MIPStarRE-QPBT repository's docs/comparator.md).
rev = "ecb97d1f66eec1e6fad964f144f78b91ce1fab36"

[[lean_lib]]
name = "Challenge"
# one challenge module per contributing library module
globs = ["Challenge", "Challenge.+"]

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "QPBTComparator"
