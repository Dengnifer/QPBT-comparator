name = "QPBTComparator"
version = "0.1.0"
defaultTargets = ["QPBTComparator", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "MIPStarRE"
git = "https://github.com/Dengnifer/MIPStarRE-QPBT-bak.git"
rev = "b18311e49b4ec92d7ab13f1930ecbaa8a76850e8"

[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "QPBTComparator"
