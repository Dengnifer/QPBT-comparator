      declaration: "MIPStarRE.QPBT.exists_spcc_value_one"
      file: "MIPStarRE/QPBT/Test/Completeness.lean"
      comparator_config: "comparator.json"
    - name: "Simultaneous low-degree test soundness"
      declaration: "MIPStarRE.QPBT.exists_ld_soundness"
      file: "MIPStarRE/QPBT/Test/LowDegreeGameTheorems.lean"
      comparator_config: "comparator.json"
    - name: "Pauli basis test soundness"
      declaration: "MIPStarRE.QPBT.pauli_soundness"
      file: "MIPStarRE/QPBT/Test/Soundness.lean"
      comparator_config: "comparator.json"
    - name: "Qubit-coordinate Pauli soundness"
